spring:
  application:
    name: 11th-neordinary-hackathon-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
  # 이미지 업로드 (images.data MEDIUMBLOB 최대 16MB) — 모든 프로필(로컬/운영) 공통
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 애플리케이션 정책 (환경변수로 덮어쓰기 가능: APP_IMAGE_MAX_DIMENSION 등)
app:
  image:
    profile-max-size: 5MB
    max-dimension: 8192   # 가로 · 세로 최대 픽셀 (아이폰 48MP 원본 8064x6048 허용)
    cache-max-age: 30d    # 이미지 조회 Cache-Control (이미지는 수정되지 않으므로 길게)

# Swagger: 응답 미디어 타입을 */* 대신 application/json으로 표시
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha   # 경로순: 목록/생성(/api/routines) → 상세/수정/삭제(/{routineId})
    display-request-duration: true

server:
  port: ${PORT:8080}
  # Cloud Run 앞단 프록시의 X-Forwarded-* 헤더를 신뢰 (Swagger 등에서 https URL 생성)
  forward-headers-strategy: framework
  tomcat:
    # 한도를 넘는 업로드도 끝까지 읽은 뒤 400(FILE400) JSON으로 응답 (기본 2MB면 연결이 끊김)
    max-swallow-size: 32MB # Cloud Run 요청 한도(32MB)와 동일하게 상한 고정

---
# 로컬 개발 프로필 (기본값): docker compose up -d 로 띄운 로컬 MySQL 사용
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hackathon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hackathon}
    password: ${DB_PASSWORD:hackathon}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# 운영(Cloud Run) 프로필: 모든 민감정보는 환경변수(Secret Manager)로 주입
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
