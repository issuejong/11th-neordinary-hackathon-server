spring:
  application:
    name: 11th-neordinary-hackathon-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
  # 이미지 업로드 (images.data MEDIUMBLOB 최대 16MB) — 모든 프로필(로컬/운영) 공통
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  # Cloud Run 앞단 프록시의 X-Forwarded-* 헤더를 신뢰 (Swagger 등에서 https URL 생성)
  forward-headers-strategy: framework

---
# 로컬 개발 프로필 (기본값): docker compose up -d 로 띄운 로컬 MySQL 사용
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hackathon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hackathon}
    password: ${DB_PASSWORD:hackathon}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# 운영(Cloud Run) 프로필: 모든 민감정보는 환경변수(Secret Manager)로 주입
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
