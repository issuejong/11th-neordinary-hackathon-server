spring:
  application:
    name: 11th-neordinary-hackathon-server
  profiles:
    default: dev
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}
  # Cloud Run 앞단 프록시의 X-Forwarded-* 헤더를 신뢰 (Swagger 등에서 https URL 생성)
  forward-headers-strategy: framework

---
# 운영(Cloud Run) 프로필: 모든 민감정보는 환경변수(Secret Manager)로 주입
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
